name: CI

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop", "main"]

permissions:
  id-token: write
  contents: read

jobs:
  # ✨ 코드 스타일 검사 (Format)
  format:
    uses: ./.github/workflows/format.yml

  # 🧪 빌드 및 테스트 (Test)
  # Format이 성공해야만 실행 (의존성: needs: [format])
  test:
    needs: [format]
    uses: ./.github/workflows/test.yml
    with:
      xcode-version: '16.2'
    secrets: inherit
