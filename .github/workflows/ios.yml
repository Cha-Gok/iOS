name: iOS Optimized Workflow

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: macos-latest
    env:
      HOME: /Users/runner
      TUIST_ROOT_DIR: ${{ github.workspace }}/ChaGok
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. SwiftLint·Tuist 설치
      - name: Install SwiftLint and Tuist
        run: brew install swiftlint tuist

      # 2. Tuist 버전 확인
      - name: Check Tuist Version
        run: tuist version

      # 3. SPM 의존성 캐싱
      - name: Cache SPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ChaGok/Tuist/.build
            ChaGok/Tuist/Dependencies
            /Users/runner/Library/Caches/org.swift.swiftpm
          key: spm-deps-${{ runner.os }}-${{ hashFiles('ChaGok/Tuist/Package.resolved') }}
          restore-keys: |
            spm-deps-${{ runner.os }}-

      # 4. Tuist 의존성 설치
      - name: Install Tuist Dependencies
        working-directory: ChaGok
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tuist install

      # 5. Tuist 인증
      - name: Tuist auth login
        working-directory: ChaGok
        run: tuist auth login

      # 6. Xcode cache 로컬 서비스 설정
      - name: Tuist setup cache
        working-directory: ChaGok
        run: tuist setup cache

      - name: Tuist cache warm
        working-directory: ChaGok
        run: tuist cache

      # 8. 프로젝트 생성
      - name: Generate Project
        working-directory: ChaGok
        run: tuist generate --cache-profile all-possible

      # 9. 테스트
      - name: Run Tests
        working-directory: ChaGok
        run: tuist test
