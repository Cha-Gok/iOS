name: iOS starter workflow

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            $HOME/Library/Developer/Xcode/DerivedData
            ChaGok/.build
          key: macos-chagok-${{ runner.os }}-${{ hashFiles('ChaGok/Tuist/Package.resolved', 'ChaGok/Project.swift') }}
          restore-keys: |
            macos-chagok-${{ runner.os }}-

      - name: Install Tuist
        run: brew install tuist

      - name: Install SwiftLint and SwiftFormat
        run: brew install swiftlint swiftformat

      - name: Generate project
        working-directory: ChaGok
        run: |
          tuist install
          tuist generate

      - name: Set Scheme
        working-directory: ChaGok
        id: set_scheme
        run: |
          if [ -n "$(ls -A | grep -i '\.xcworkspace$')" ]; then
            echo "filetype=workspace" >> $GITHUB_OUTPUT
            file_to_build=$(ls -A | grep -i '\.xcworkspace$' | head -1 | awk '{$1=$1;print}')
            scheme=$(xcodebuild -list -json -workspace "$file_to_build" | ruby -e "require 'json'; d=JSON.parse(STDIN.read); puts (d.dig('workspace','schemes') || d.dig('project','schemes') || [d.dig('project','targets',0)])[0]")
          else
            echo "filetype=project" >> $GITHUB_OUTPUT
            file_to_build=$(ls -A | grep -i '\.xcodeproj$' | head -1 | awk '{$1=$1;print}')
            scheme=$(xcodebuild -list -json -project "$file_to_build" | ruby -e "require 'json'; d=JSON.parse(STDIN.read); puts (d.dig('project','schemes') || [d.dig('project','targets',0)])[0]")
          fi
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT
          echo "scheme=$scheme" >> $GITHUB_OUTPUT
          echo "Using scheme: $scheme"

      - name: Build
        working-directory: ChaGok
        env:
          platform: ${{ 'iOS Simulator' }}
        run: |
          device=$(xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e "s/ Simulator$//")
          xcodebuild build-for-testing -scheme "${{ steps.set_scheme.outputs.scheme }}" -"${{ steps.set_scheme.outputs.filetype }}" "${{ steps.set_scheme.outputs.file_to_build }}" -destination "platform=$platform,name=$device"

      - name: Test
        working-directory: ChaGok
        env:
          platform: ${{ 'iOS Simulator' }}
        run: |
          device=$(xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e "s/ Simulator$//")
          xcodebuild test-without-building -scheme "${{ steps.set_scheme.outputs.scheme }}" -"${{ steps.set_scheme.outputs.filetype }}" "${{ steps.set_scheme.outputs.file_to_build }}" -destination "platform=$platform,name=$device" -only-testing:ChaGokTests -only-testing:CoreTests -only-testing:DomainTests -only-testing:DataTests -only-testing:PresentationTests
