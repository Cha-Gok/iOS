name: iOS starter workflow

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  build:
    name: Build and Test (Tuist)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            $HOME/Library/Developer/Xcode/DerivedData
            ChaGok/.build
          key: macos-chagok-${{ runner.os }}-${{ hashFiles('ChaGok/Project.swift', 'ChaGok/Tuist/Package.resolved', 'ChaGok/Tuist/ProjectDescriptionHelpers/**') }}
          restore-keys: |
            macos-chagok-${{ runner.os }}-

      - name: Install Tuist
        run: brew install tuist

      - name: Install SwiftLint and SwiftFormat
        run: brew install swiftlint swiftformat

      - name: Install dependencies and generate
        working-directory: ChaGok
        run: |
          tuist install
          tuist generate

      - name: Build
        working-directory: ChaGok
        run: tuist build

      - name: Test
        working-directory: ChaGok
        run: tuist test
