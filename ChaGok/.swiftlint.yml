# SwiftLint Configuration - ChaGok
# https://github.com/realm/SwiftLint

disabled_rules:
  - trailing_whitespace  # SwiftFormat에서 처리
  - trailing_comma      # Swift 스타일: 멀티라인에서 trailing comma 허용 (git diff 깔끔)

opt_in_rules:
  - empty_count
  - explicit_init
  - closure_spacing
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - modifier_order
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - vertical_parameter_alignment_on_call

excluded:
  - Derived
  - Tuist
  - .build
  - build
  - "*.xcodeproj"
  - "*.xcworkspace"
  - "**/Resources/**"
  - "**/Assets.xcassets/**"
  - "**/Preview Content/**"

line_length:
  warning: 120
  error: 150
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800

type_body_length:
  warning: 300
  error: 400

function_body_length:
  warning: 50
  error: 80

reporter: "xcode"
